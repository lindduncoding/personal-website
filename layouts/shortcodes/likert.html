{{ $endpoint := .Get "endpoint" }}

<form class="likert-form" action="{{ $endpoint }}" method="post">
  <input type="text" name="age" placeholder="Umur" aria-required>
  {{ .Inner }}

  <input type="text" name="token" placeholder="tokennya apa maniez" aria-required>
  <input type="hidden" name="score-phq" class="phq-score">
  <input type="hidden" name="score-gad" class="gad-score">

  <button type="submit">Calculate score</button>
  <p class="likert-result" role="status" aria-live="polite"></p>
</form>

<script>
  const STORAGE_KEY = 'posbindu-submitted';

  document.querySelectorAll('.likert-form').forEach((form) => {
    if (localStorage.getItem(STORAGE_KEY)) {
      form.innerHTML = '<p>Terima kasih sudah men-submit dengan jujur :D</p>';
      return;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const phqQuestions = [...form.querySelectorAll('fieldset[name="phq"]')];
      const gadQuestions = [...form.querySelectorAll('fieldset[name="gad"]')];
      const button = form.querySelector('button[type="submit"]');
      const result = form.querySelector('.likert-result');
      let pScore = 0;
      let gScore = 0;

      for (const question of phqQuestions) {
        const options = [...question.querySelectorAll('input[type="radio"]')];
        const selected = options.find((option) => option.checked);

        if (!selected) {
          question.querySelector('input[type="radio"]')?.focus();
          result.textContent = 'Please answer every question.';
          return;
        }

        pScore += options.indexOf(selected);
      }

      for (const question of gadQuestions) {
        const options = [...question.querySelectorAll('input[type="radio"]')];
        const selected = options.find((option) => option.checked);

        if (!selected) {
          question.querySelector('input[type="radio"]')?.focus();
          result.textContent = 'Please answer every question.';
          return;
        }

        gScore += options.indexOf(selected);
      }

      form.querySelector('.phq-score').value = pScore;
      result.textContent +=
        `Skor PHQ-9 Anda adalah ${pScore} dari ${phqQuestions.length * 3}.`;

      if (pScore > 20) {
        result.textContent += ` Mungkin bisa ke psikolog?`
      }

      form.querySelector('.gad-score').value = gScore;
      result.textContent +=
        ` Dan skor GAD-7 Anda adalah ${gScore} dari ${gadQuestions.length * 3}.`;

      if (gScore > 15) {
        result.textContent += ` Mungkin bisa ke psikolog?`
      }

      button.disabled = true;
      try {
        const response = await fetch(form.action, {
          method: 'POST',
          // mode: 'no-cors',
          body: new FormData(form)
        });

        const data = await response.json();
        console.log(data)

        if (data.ok){
          localStorage.setItem(STORAGE_KEY, '1');
          result.textContent += ' Data berhasil disimpan!';
        } else {
          result.textContent += ' Data tidak berhasil disimpan!';
        }

      } catch (error) {
        result.textContent += ' Ada yang eror :(';
      }
    });
  });
</script>
